<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="css/style.css"/>
    </head>
    <body>
        <!-- svg areas for visualizations -->
        <div class="wrapper">
            <!-- Upper section: sliders and heatmap -->
            <div class="slider" id="sliderdiv-upper"></div>
            <div class="heatmap" id="heatmapdiv"></div>
            <div class="slider" id="sliderdiv-lower"></div>

            <!-- Middle: upper map and bar plot -->
            <div class="geo-selector" id="selectordiv"></div>
            <div class="map" id="choroplethdiv-upper"></div>
            <div class="barplot" id="barplotdiv-upper"></div>

            <!-- Lower: lower map and bar plot -->
            <div class="map" id="choroplethdiv-lower"></div>
            <div class="barplot" id="barplotdiv-lower"></div>

            <!-- Lower: lower map and bar plot -->
            <!-- <div class="map">
                <svg id="choropleth-lower"></svg>
            </div>
            <div class="barplot">
                <svg id="barplot-lower"></svg>
            </div> -->
        </div>

        <!-- Tooltips -->
        <div id="map-tooltip" class="tooltip"></div>

        <!-- Source code -->
        <script type="module" src="js/choroplethMap.js"></script>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
